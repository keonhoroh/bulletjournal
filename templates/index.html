<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bullet journal</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="bg-gray-50 min-h-screen text-gray-900">
    <div class="max-w-2xl mx-auto px-4 py-10">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-3xl font-bold">
            it's good to see you, {{ current_user.username }}
          </h1>
        </div>
        <a href="/logout" class="text-sm text-gray-500 hover:text-orange-400"
          >log out</a
        >
      </div>

      <form
        id="journal-form"
        class="bg-white rounded-xl shadow-sm p-6 space-y-6"
      >
        <div>
          <label
            for="highlight"
            class="block text-sm font-medium text-gray-700 mb-1"
            >today's highlight</label
          >
          <input
            type="text"
            id="highlight"
            value="watched new spider-man with friends"
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <fieldset class="border border-gray-200 rounded-lg p-4">
          <legend class="text-sm font-semibold text-gray-700 px-1">
            daily checklist
          </legend>
          <div class="flex justify-between text-xs text-gray-500 mt-2 mb-1">
            <span>progress</span>
            <span id="habit-progress-label">0/5</span>
          </div>
          <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
            <div
              id="habit-progress-bar"
              class="h-full bg-indigo-600 transition-all duration-300"
              style="width: 0%"
            ></div>
          </div>
          <div class="space-y-1 mt-2">
            <div class="habit-row flex items-center gap-2 rounded-md px-2 py-1">
              <input
                type="checkbox"
                id="habit1"
                class="h-4 w-4 rounded border-gray-300 accent-indigo-600"
              />
              <label for="habit1" class="text-sm">15 min stretch</label>
            </div>

            <div class="habit-row flex items-center gap-2 rounded-md px-2 py-1">
              <input
                type="checkbox"
                id="habit2"
                class="h-4 w-4 rounded border-gray-300 accent-indigo-600"
              />
              <label for="habit2" class="text-sm">read 10 pages</label>
            </div>

            <div class="habit-row flex items-center gap-2 rounded-md px-2 py-1">
              <input
                type="checkbox"
                id="habit3"
                class="h-4 w-4 rounded border-gray-300 accent-indigo-600"
              />
              <label for="habit3" class="text-sm">exercise</label>
            </div>

            <div class="habit-row flex items-center gap-2 rounded-md px-2 py-1">
              <input
                type="checkbox"
                id="habit4"
                class="h-4 w-4 rounded border-gray-300 accent-indigo-600"
              />
              <label for="habit4" class="text-sm">1 leetcode problem</label>
            </div>

            <div class="habit-row flex items-center gap-2 rounded-md px-2 py-1">
              <input
                type="checkbox"
                id="habit5"
                class="h-4 w-4 rounded border-gray-300 accent-indigo-600"
              />
              <label for="habit5" class="text-sm"
                >practice motion graphics</label
              >
            </div>
          </div>
        </fieldset>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >day rating</label
          >
          <div class="flex justify-center py-2">
            <div
              id="rating-dial"
              class="relative w-36 h-36 cursor-pointer touch-none select-none"
            >
              <svg viewBox="0 0 160 160" class="w-full h-full -rotate-90">
                <circle
                  cx="80"
                  cy="80"
                  r="70"
                  stroke="#e5e7eb"
                  stroke-width="12"
                  fill="none"
                />
                <circle
                  id="rating-arc"
                  cx="80"
                  cy="80"
                  r="70"
                  stroke="#4f46e5"
                  stroke-width="12"
                  stroke-linecap="round"
                  fill="none"
                />
              </svg>
              <div class="absolute inset-0 flex items-center justify-center">
                <span
                  id="rating-output"
                  class="text-3xl font-semibold text-indigo-600"
                  >6.7</span
                >
              </div>
            </div>
            <input type="hidden" id="rating" value="6.7" />
          </div>
        </div>

        <button
          type="submit"
          class="bg-indigo-600 text-white py-2 rounded-md font-medium w-full hover:bg-indigo-700 transition-colors"
        >
          submit
        </button>
      </form>

      <section class="mt-10">
        <h2 class="text-xl font-semibold mb-3">ratings over time</h2>
        <div
          id="ratings-chart"
          class="bg-white rounded-xl shadow-sm p-4 flex items-end gap-1 h-32 overflow-x-auto"
        ></div>
      </section>

      <section class="mt-10">
        <h2 class="text-xl font-semibold mb-3">past entries</h2>
        <ul id="entries-list" class="space-y-2"></ul>
      </section>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
