<!DOCTYPE html>
<html>
  <head>
    <title>bullet journal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <h1>it's good to see you.</h1>

    <form id="journal-form">
      <label for="highlight">today's highlight</label>
      <input
        type="text"
        id="highlight"
        value="watched new spider-man with friends"
      />

      <fieldset>
        <legend>daily checklist</legend>
        <div class="habit-row">
          <input type="checkbox" id="habit1" />
          <label for="habit1">15 min stretch</label>
        </div>

        <div class="habit-row">
          <input type="checkbox" id="habit2" />
          <label for="habit2">read 10 pages</label>
        </div>

        <div class="habit-row">
          <input type="checkbox" id="habit3" />
          <label for="habit3">exercise</label>
        </div>

        <div class="habit-row">
          <input type="checkbox" id="habit4" />
          <label for="habit4">1 leetcode problem</label>
        </div>

        <div class="habit-row">
          <input type="checkbox" id="habit5" />
          <label for="habit5">practice motion graphics</label>
        </div>
      </fieldset>

      <label for="rating">day rating (0-10)</label>
      <input
        type="number"
        id="rating"
        min="0"
        max="10"
        step="0.1"
        value="6.7"
      />
      <span id="rating-output">6.7</span>

      <button type="submit">submit entry</button>
    </form>

    <section>
      <h2>past entries</h2>
      <ul id="entries-list"></ul>
    </section>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
