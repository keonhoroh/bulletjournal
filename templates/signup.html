<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign up · bullet journal</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4 bg-white rounded-xl shadow-sm p-8">
      <h1 class="text-2xl font-bold mb-6">create an account</h1>

      <form method="POST" action="/signup" class="space-y-4">
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 mb-1"
            >username</label
          >
          <input
            type="text"
            id="username"
            name="username"
            required
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
            >password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <button
          type="submit"
          class="bg-indigo-600 text-white py-2 rounded-md font-medium w-full hover:bg-indigo-700 transition-colors"
        >
          sign up
        </button>
      </form>

      <p class="mt-6 text-sm text-gray-500 text-center">
        already have an account?
        <a
          href="/login"
          class="text-indigo-600 hover:text-indigo-800 font-medium"
          >log in</a
        >
      </p>
    </div>
  </body>
</html>
